<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Ферма</title>
<style>body{margin:0;background:#fff7ec}</style></head><body>
<script>
// Telegram keeps the page for a while: this tiny entry always opens the freshest app (a new address every time), keeping Telegram's data (#hash)
location.replace('app.html?' + (location.search ? location.search.slice(1) + '&' : '') + 'v=' + Date.now() + location.hash);
</script></body></html>
